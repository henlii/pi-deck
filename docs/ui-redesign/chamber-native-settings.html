<!doctype html>
<html lang="zh-CN" data-theme="dark" data-skin="chamber-native">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pidance UI · Chamber 原生 · 设置</title>
  <style>
    :root{--bg:#120f0e;--panel:#171615;--raised:#1c1a18;--hover:#ffffff12;--selected:#b9a5992b;--border:#242323;--strong:#504e4c;--text:#c9c5ba;--muted:#8f8b81;--dim:#77736b;--accent:#da7c47;--success:#76ad4f;--shadow:0 24px 80px #00000088;--ui:"Aptos","Segoe UI Variable","Noto Sans SC",sans-serif;--mono:"Cascadia Code",monospace}*{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;place-items:center;background:radial-gradient(circle at 30% 10%,#362219 0,transparent 34%),#0b0908;color:var(--text);font:13px/1.5 var(--ui)}button,input{font:inherit;color:inherit}.window{display:grid;width:min(1080px,calc(100vw - 48px));height:min(760px,calc(100dvh - 48px));grid-template-columns:240px 1fr;overflow:hidden;border:1px solid var(--strong);border-radius:14px;background:var(--bg);box-shadow:var(--shadow)}.nav{display:flex;min-height:0;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}.nav-head,.content-head{display:flex;height:52px;flex:none;align-items:center;border-bottom:1px solid var(--border)}.nav-head{padding:0 14px;font-weight:650}.content-head{padding:0 24px}.content-head h1{margin:0;font-size:15px}.close{display:grid;width:32px;height:32px;margin-left:auto;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.close:hover{background:var(--hover);color:var(--text)}.search{position:relative;margin:11px}.search input{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--border);border-radius:7px;outline:0;background:#120f0e;color:var(--text)}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #da7c4728}.search span{position:absolute;top:7px;left:10px;color:var(--dim)}.nav-list{padding:0 7px}.nav-label{padding:11px 8px 5px;color:var(--dim);font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}.nav-item{display:flex;width:100%;height:34px;padding:0 9px;align-items:center;gap:9px;border:0;border-radius:6px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.nav-item:hover{background:var(--hover);color:var(--text)}.nav-item.active{background:var(--selected);color:var(--text)}.nav-item .glyph{width:18px;color:var(--dim);text-align:center}.nav-item.active .glyph{color:var(--accent)}.nav-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);color:var(--dim);font:10px var(--mono)}.content{display:flex;min-width:0;flex-direction:column}.scroll{min-height:0;flex:1;overflow:auto;padding:34px 40px 56px}.inner{width:min(100%,690px)}.eyebrow{margin-bottom:6px;color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.intro h2{margin:0 0 7px;font-size:22px;letter-spacing:-.02em}.intro p{margin:0 0 30px;color:var(--muted);font-size:13px}.section{margin-bottom:30px}.section-title{margin:0 0 9px;font-size:13px;font-weight:650}.card{overflow:hidden;border:1px solid var(--border);border-radius:9px;background:var(--raised)}.setting{display:grid;min-height:58px;padding:11px 13px;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border-bottom:1px solid var(--border)}.setting:last-child{border-bottom:0}.copy b,.copy small{display:block}.copy b{font-weight:550}.copy small{margin-top:2px;color:var(--muted);font-size:11.5px}.select{height:32px;min-width:156px;padding:0 10px;border:1px solid var(--strong);border-radius:6px;background:#171513;color:var(--text);text-align:left}.theme-grid{display:grid;padding:13px;grid-template-columns:repeat(3,1fr);gap:10px}.theme{padding:8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.theme.active{border-color:var(--accent);box-shadow:0 0 0 2px #da7c4728;color:var(--text)}.preview{display:grid;height:76px;margin-bottom:7px;grid-template-columns:28% 1fr;overflow:hidden;border:1px solid var(--border);border-radius:5px;background:#120f0e}.preview span:first-child{background:#171615;border-right:1px solid #242323}.preview.light{background:#fdfcfa}.preview.light span:first-child{background:#f7f6f4;border-color:#e5e1de}.preview.system{background:linear-gradient(135deg,#fdfcfa 0 49%,#120f0e 51%)}.switch{position:relative;width:38px;height:22px;border:0;border-radius:999px;background:var(--accent);cursor:pointer}.switch:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#120f0e}.accent-row{display:flex;gap:8px}.swatch{width:28px;height:28px;border:2px solid transparent;border-radius:50%;cursor:pointer}.swatch-orange{background:#da7c47}.swatch-blue{background:#69a7ca}.swatch-green{background:#76ad4f}.swatch.active{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:700px){body{display:block;background:var(--bg)}.window{width:100%;height:100dvh;grid-template-columns:1fr;border:0;border-radius:0}.nav{display:none}.scroll{padding:24px 18px}.theme-grid{grid-template-columns:1fr}.content-head{padding:0 14px}}
  </style>
</head>
<body>
  <main class="window">
    <aside class="nav"><header class="nav-head">Pidance 设置</header><label class="search"><span>⌕</span><input type="search" placeholder="搜索设置"></label><nav class="nav-list"><div class="nav-label">界面</div><button class="nav-item active"><span class="glyph">◐</span>外观</button><div class="nav-label">助手</div><button class="nav-item"><span class="glyph">◇</span>模型</button><button class="nav-item"><span class="glyph">☷</span>默认值</button><div class="nav-label">扩展</div><button class="nav-item"><span class="glyph">▤</span>技能</button><button class="nav-item"><span class="glyph">⌁</span>插件</button><button class="nav-item"><span class="glyph">◇</span>信任</button></nav><footer class="nav-foot">Pidance v0.1.0 · 网页客户端</footer></aside>
    <section class="content"><header class="content-head"><h1>外观</h1><button class="close" aria-label="关闭">×</button></header><div class="scroll"><div class="inner"><div class="intro"><div class="eyebrow">界面</div><h2>让工作区更适合长时间阅读</h2><p>外观只影响当前浏览器。系统模式会跟随设备的浅色与深色设置。</p></div>
      <section class="section"><h3 class="section-title">主题</h3><div class="card"><div class="theme-grid"><button class="theme"><span class="preview light"><span></span><span></span></span>浅色</button><button class="theme active"><span class="preview"><span></span><span></span></span>深色</button><button class="theme"><span class="preview system"><span></span><span></span></span>跟随系统</button></div></div></section>
      <section class="section"><h3 class="section-title">显示</h3><div class="card"><div class="setting"><span class="copy"><b>界面密度</b><small>调整会话列表和控件的垂直间距。</small></span><button class="select">紧凑　⌄</button></div><div class="setting"><span class="copy"><b>代码字体</b><small>用于代码块、终端输出和轮次计时。</small></span><button class="select">Cascadia Code　⌄</button></div><div class="setting"><span class="copy"><b>显示聊天小地图</b><small>在长会话右侧显示消息位置概览。</small></span><button class="switch" aria-label="显示聊天小地图，已开启"></button></div></div></section>
      <section class="section"><h3 class="section-title">强调色</h3><div class="card"><div class="setting"><span class="copy"><b>状态与焦点颜色</b><small>运行、链接和主要操作仍使用可辨识的语义色。</small></span><span class="accent-row"><button class="swatch swatch-orange active" aria-label="暖橙"></button><button class="swatch swatch-blue" aria-label="月光蓝"></button><button class="swatch swatch-green" aria-label="松针绿"></button></span></div></div></section>
    </div></div></section>
  </main>
</body>
</html>
