<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Pi Deck README 横幅：左图标 + 字标 + 一句话说明 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b23"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d212a"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab2fb"/>
      <stop offset="1" stop-color="#4a90f4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- 图标（210px，含深色圆角底） -->
  <g transform="translate(150 215) scale(0.41015625)">
    <rect width="512" height="512" rx="116" fill="url(#tile)"/>
    <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
    <g fill="#f4f7fd">
      <rect x="118" y="176" width="276" height="58" rx="29"/>
      <rect x="176" y="176" width="52" height="206" rx="26"/>
      <rect x="284" y="176" width="52" height="206" rx="26"/>
    </g>
    <rect x="166" y="140" width="180" height="30" rx="15" fill="url(#layer)"/>
  </g>
  <!-- 字标与说明 -->
  <text x="428" y="322" font-size="88" font-weight="bold" fill="#f4f7fd" letter-spacing="1">Pi Deck</text>
  <text x="430" y="387" font-size="30" fill="#98a2b3">A unified workspace for Pi agent sessions</text>
  <rect x="0.75" y="0.75" width="1278.5" height="638.5" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
</svg>
