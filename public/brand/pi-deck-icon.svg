<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pi Deck 品牌主图标：深色圆角底 + π/deck 层叠标记 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d212a"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab2fb"/>
      <stop offset="1" stop-color="#4a90f4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <!-- π 标记：横梁与双腿 -->
  <g fill="#f4f7fd">
    <rect x="118" y="176" width="276" height="58" rx="29"/>
    <rect x="176" y="176" width="52" height="206" rx="26"/>
    <rect x="284" y="176" width="52" height="206" rx="26"/>
  </g>
  <!-- deck 层：横梁上方露出的第二张卡片 -->
  <rect x="166" y="140" width="180" height="30" rx="15" fill="url(#layer)"/>
</svg>
